# --- Contract clause scanner (words looked for in the document text or transcript) ---
# A hit only raises a warning (amber), never red: a keyword cannot tell
# "the employer will keep" from "the employer will not keep".

# The paper talks about the employer keeping the worker's passport.
passport_kept_keywords:
  - passport will be kept
  - passport shall be kept
  - passport will be held
  - passport shall be held
  - keep the passport
  - keep your passport
  - hold the passport
  - hold your passport
  - retain the passport
  - retain your passport
