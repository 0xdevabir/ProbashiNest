# Verdict-engine thresholds and keyword lists.
# These are DESIGN CHOICES of this project, not legal facts — they have no source.
# Change them here; the code reads this file.

# The agency register copy must be at most this old for a licence to count as
# verified. An older copy can no longer support a green verdict.
register_max_age_days: 180

# Extraction confidence below this is treated as "we could not read the offer well".
low_confidence_below: 0.5

# A fee above the government ceiling is a warning. It becomes a high-severity flag
# when the ceiling record is verified, or when the fee is at least this many times
# the ceiling (so an out-of-date ceiling cannot explain the gap).
fee_gross_multiple: 3

# SALARY_UNREALISTIC: a low-skilled job offered at more than this many times the
# destination's legal minimum wage. Only applies where a minimum wage exists.
salary_unrealistic_multiple: 4

# How similar (0-1) the offer's agency name must be to the registered name.
agency_name_match_ratio: 0.85

