[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probashi-shield"
version = "0.1.0"
description = "Bangla voice-first AI that checks migrant workers' job offers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["probashi*"]

[tool.pytest.ini_options]
testpaths = ["tests", "probashi", "backend"]
